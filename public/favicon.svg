<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f17"/>
      <stop offset="100%" stop-color="#0f1a2e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <linearGradient id="accentStroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.7"/>
    </linearGradient>
  </defs>
  <!-- Dark rounded square background -->
  <rect width="64" height="64" rx="16" fill="url(#bg)"/>
  <!-- Subtle border -->
  <rect x="1.5" y="1.5" width="61" height="61" rx="14.5" fill="none" stroke="url(#accentStroke)" stroke-width="1"/>
  <!-- Stylized M letterform — two peaks, clean geometric -->
  <path
    d="M13 46 L13 20 L23 35 L32 22 L41 35 L51 20 L51 46"
    fill="none"
    stroke="url(#accent)"
    stroke-width="4.5"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <!-- Accent dot under M -->
  <circle cx="32" cy="51" r="2.5" fill="url(#accent)" opacity="0.85"/>
</svg>
